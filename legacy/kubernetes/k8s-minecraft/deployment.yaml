apiVersion: apps/v1
kind: Deployment

metadata:
  name: minecraft

spec:
  replicas: 1

  selector:
    matchLabels:
      app: minecraft

  template:
    metadata:
      labels:
        app: minecraft

    spec:

      containers:
      - name: minecraft
        image: itzg/minecraft-server
        imagePullPolicy: Always
        ports:
        - containerPort: 25565
        env:
        - name: EULA
          value: "TRUE"
        - name: TYPE
          value: "PAPER"
        - name: VERSION
          value: "26.2"
        - name: MEMORY
          value: "4G"
        - name: ONLINE_MODE
          value: "TRUE"
        - name: DIFFICULTY
          value: "normal"
        - name: MODE
          value: "survival"
        - name: ENABLE_ROLLING_LOGS
          value: "true"
        - name: SEED
          value: "5063885805507972583"
        - name: OPS
          value: "Jiranuwat"
        - name: OVERRIDE_SERVER_PROPERTIES
          value: "true"
        volumeMounts:
        - name: minecraft-data
          mountPath: /data

      - name: playit
        image: ghcr.io/playit-cloud/playit-agent:0.17
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: playit-secret
              key: secret-key

      volumes:
      - name: minecraft-data
        hostPath:
          path: /minecraft-data
          type: Directory
