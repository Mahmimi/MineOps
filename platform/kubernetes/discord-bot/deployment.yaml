apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-bot
  namespace: mineops
  labels:
    app.kubernetes.io/name: discord-bot
    app.kubernetes.io/component: chatops
    app.kubernetes.io/part-of: mineops
    app.kubernetes.io/managed-by: manifest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-bot
        app.kubernetes.io/component: chatops
        app.kubernetes.io/part-of: mineops
        app.kubernetes.io/managed-by: manifest
    spec:
      serviceAccountName: discord-bot
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: discord-bot
          image: mineops-discord-bot:phase5.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: mineops-discord-bot
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: token
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: client-id
                  optional: true
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: guild-id
                  optional: true
            - name: DISCORD_ALERT_CHANNEL_ID
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: alert-channel-id
                  optional: true
            - name: DISCORD_REGISTER_COMMANDS
              value: "true"
            - name: DISCORD_REQUIRED
              value: "false"
            - name: MINEOPS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MINECRAFT_DEPLOYMENT_NAME
              value: minecraft
            - name: MINECRAFT_SERVICE_NAME
              value: minecraft
            - name: MINECRAFT_LABEL_SELECTOR
              value: app.kubernetes.io/name=minecraft
            - name: MINECRAFT_QUERY_HOST
              value: minecraft-query
            - name: MINECRAFT_QUERY_PORT
              value: "25565"
            - name: MINECRAFT_QUERY_TIMEOUT_MS
              value: "2000"
            - name: BACKUP_CRONJOB_NAME
              value: minecraft-backup
            - name: BACKUP_LABEL_SELECTOR
              value: app.kubernetes.io/name=minecraft-backup
            - name: MONITORING_ENABLED
              value: "true"
            - name: MONITORING_INTERVAL_MS
              value: "60000"
            - name: PVC_USAGE_WARNING_PERCENT
              value: "80"
          volumeMounts:
            - name: alert-history
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: alert-history
          persistentVolumeClaim:
            claimName: alert-history


