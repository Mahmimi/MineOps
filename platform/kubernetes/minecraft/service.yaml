apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: mineops
  labels:
    app.kubernetes.io/name: minecraft
    app.kubernetes.io/component: game-server
    app.kubernetes.io/part-of: mineops
    app.kubernetes.io/managed-by: terraform
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
