apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: mineops-local
servers: 1
agents: 1
ports:
  - port: 25565:25565
    nodeFilters:
      - loadbalancer
volumes:
  - volume: ./.local/k3d/storage:/var/lib/rancher/k3s/storage
    nodeFilters:
      - server:*
      - agent:*
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
